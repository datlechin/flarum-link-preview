name: Link Preview JS

on: [workflow_dispatch, push, pull_request]

# The build action commits the compiled bundles back to the branch, so the
# Composer package ships them prebuilt. Without this the job reaches the end
# and fails on a 403, having already built and tested everything.
permissions:
  contents: write

jobs:
  run:
    uses: flarum/framework/.github/workflows/REUSABLE_frontend.yml@2.x
    with:
      # `bundlewatch` is not a dependency of this package and there is no
      # token for it on this account.
      enable_bundlewatch: false
      enable_prettier: true
      enable_typescript: true

      # `typescript-coverage-report` has not been released for TypeScript 5,
      # which the rest of the toolchain needs.
      type_coverage_script: ''

      frontend_directory: ./js
      backend_directory: .
      js_package_manager: npm
      main_git_branch: main
