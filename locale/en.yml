datlechin-link-preview:

  admin:

    sections:
      appearance_label: Appearance
      appearance_description: How a preview looks, and where pressing it goes.
      behaviour_label: Behaviour
      behaviour_description: Which links in a post get a preview.
      performance_label: Performance
      performance_description: How previews are fetched and how long they are kept.
      filtering_label: Filtering
      filtering_description: >
        Which sites may be previewed. One entry per line, or separated by
        commas. A host matches its subdomains too, and * stands for one part
        of a name.

    settings:
      open_links_in_new_tab_label: Open links in a new tab
      open_links_in_new_tab_help: Other sites only. A discussion here always opens in the same tab.

      google_favicon_fallback_label: Fall back to Google for site icons
      google_favicon_fallback_help: >
        Used when a site offers no icon of its own. It tells Google which sites
        your members link to.

      preview_internal_links_label: Preview links to this forum
      preview_internal_links_help: >
        A link here to a discussion, member, tag or the index becomes a card
        read from the database, so nothing is fetched and nobody sees more than
        they could already open.

      skip_media_links_label: Skip links to media files
      skip_media_links_help: For links ending in an image, audio or video file, which Flarum already renders.

      max_previews_per_post_label: Previews per post
      max_previews_per_post_help: Links past this count are left as plain links.

      enable_batch_requests_label: Fetch previews in batches
      enable_batch_requests_help: >
        One request for the whole page instead of one per link. Turn it off only
        if something in front of the forum rejects it.

      cache_time_label: Cache duration (minutes)
      cache_time_help: How long a preview is kept before the site is read again. 0 turns caching off.

      allowlist_label: Allowed sites
      allowlist_help: While this is not empty, only links matching it are previewed.
      allowlist_placeholder: "docs.example.com, *.wikipedia.org"

      blocklist_label: Blocked sites
      blocklist_help: Never previewed, even when the allowed list lets them through.
      blocklist_placeholder: "example.com, news.example.org/sponsored"

  forum:

    loading: Loading preview

    # The facts a card built from the database lists under its title. Only the
    # counted ones need a string: the rest carry their own text or a date.
    meta:
      replies: "{count, plural, one {# reply} other {# replies}}"
      posts: "{count, plural, one {# post} other {# posts}}"
      discussions: "{count, plural, one {# discussion} other {# discussions}}"

    # Shown only when something on the forum is counting clicks. Both the number
    # and the decision that it is worth showing come from that extension.
    clicks: "{count, plural, one {# click} other {# clicks}}"

    settings:
      hide_link_previews_label: Hide link previews
      hide_link_previews_help: Show the plain address instead of a preview card in every post you read.
